<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
     let nilai = 82;
    let predikat;

    if (nilai >= 90) {
      predikat = "A";
    } else if (nilai >= 80) {
      predikat = "B";
    } else if (nilai >= 70) {
      predikat = "C";
    } else {
      predikat = "D";
    }

    console.log("Nilai: " + nilai);
    console.log("Predikat: " + predikat);

       
    </script>
</body>
</html>
